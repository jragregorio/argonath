services:
  postgres:
    image: postgres:16-alpine
    container_name: argonath-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guardian
    volumes:
      - argonath_pgdata:/var/lib/postgresql/data

volumes:
  argonath_pgdata:
